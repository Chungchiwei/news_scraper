name: 🚢 WHL Maritime Intelligence

on:
  # ─────────────────────────────────────────────
  # 排程：每日 08:05 / 20:05 台北時間
  #
  # 使用 Asia/Taipei，無需自行換算 UTC。
  # 刻意避開整點，降低 GitHub Actions 尖峰排程延遲機率。
  # 若一定要 08:00 / 20:00，可把 5 改為 0。
  # ─────────────────────────────────────────────
  schedule:
    - cron: '5 8,20 * * *'
      timezone: 'Asia/Taipei'

  # ─────────────────────────────────────────────
  # 手動執行
  # ─────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      hours_back:
        description: '抓取幾小時內的新聞'
        required: false
        default: '12'
        type: string

      dry_run:
        description: 'Dry Run：建立情報與 State，但不發送正式 Email'
        required: false
        default: false
        type: boolean


# ─────────────────────────────────────────────
# 同時間僅允許一個 Production Run
#
# 不取消正在執行的舊 Run，
# 避免 SQLite State 寫入中途遭中止。
# ─────────────────────────────────────────────
concurrency:
  group: whl-maritime-intelligence-production
  cancel-in-progress: false


# ─────────────────────────────────────────────
# 最小 GitHub Token 權限
#
# actions:read：
# 用於尋找 / 下載上一輪 Runtime State Artifact
# ─────────────────────────────────────────────
permissions:
  contents: read
  actions: read


jobs:
  maritime-intelligence:
    name: 🚢 Maritime Intelligence Cycle

    runs-on: ubuntu-latest

    # Phase 1~8 已比原始 scraper 複雜，
    # 30 分鐘比原本 20 分鐘保守。
    timeout-minutes: 30

    # ───────────────────────────────────────────
    # Production Environment
    #
    # Secret 一律來自 GitHub Secrets。
    # 非敏感開關可使用 Repository Variables。
    # ───────────────────────────────────────────
    env:
      PYTHONUNBUFFERED: '1'
      TZ: Asia/Taipei

      # ── Email ────────────────────────────────
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}

      # SMTP
      # 保留 MAIL_SMTP_* 名稱，
      # 同時提供 MAIL_SERVER / MAIL_PORT compatibility alias。
      MAIL_SMTP_SERVER: ${{ vars.MAIL_SMTP_SERVER || 'smtp.gmail.com' }}
      MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT || '587' }}

      MAIL_SERVER: ${{ vars.MAIL_SMTP_SERVER || 'smtp.gmail.com' }}
      MAIL_PORT: ${{ vars.MAIL_SMTP_PORT || '587' }}

      # 若目前 EmailConfig 使用 MAIL_HOST，也兼容
      MAIL_HOST: ${{ vars.MAIL_SMTP_SERVER || 'smtp.gmail.com' }}

      # ── News ─────────────────────────────────
      NEWS_HOURS_BACK: ${{ inputs.hours_back || vars.NEWS_HOURS_BACK || '12' }}

      # ── Email Policy ─────────────────────────
      SEND_NO_RISK_BRIEF: ${{ vars.SEND_NO_RISK_BRIEF || 'true' }}

      # ── Teams ────────────────────────────────
      TEAMS_MANAGEMENT_WEBHOOK_URL: ${{ secrets.TEAMS_MANAGEMENT_WEBHOOK_URL }}
      TEAMS_SYSTEM_WEBHOOK_URL: ${{ secrets.TEAMS_SYSTEM_WEBHOOK_URL }}

      # ── Optional LLM ─────────────────────────
      LLM_ENABLED: ${{ vars.LLM_ENABLED || 'false' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'disabled' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || '' }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Phase 6 Privacy Guardrail
      LLM_ALLOW_INTERNAL_OPERATIONAL_DATA: 'false'


    steps:

      # ==================================================
      # STEP 1
      # Checkout
      # ==================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v6


      # ==================================================
      # STEP 2
      # Python
      # ==================================================
      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          # 若 PYTHON_VERSION.md / Phase 8 Audit
          # 最終確認不是 3.11，請讓 Claude 改成實際驗證版本。
          python-version: '3.11'

          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt


      # ==================================================
      # STEP 3
      # Dependencies
      # ==================================================
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install -r requirements.txt

          echo "✅ Production dependencies installed"


      # ==================================================
      # STEP 4
      # Repository / Package Validation
      # ==================================================
      - name: 🔎 Validate repository structure
        run: |
          echo "============================================"
          echo " WHL Maritime Intelligence"
          echo " Repository Validation"
          echo "============================================"

          REQUIRED_FILES=(
            "maritime_news.py"
            "email_sender.py"
            "requirements.txt"
            "VERSION"
            ".env.example"
            "scripts/health_check.py"
          )

          for file in "${REQUIRED_FILES[@]}"; do

            if [ -f "$file" ]; then
              echo "✅ $file"

            else
              echo "::error::Required file missing: $file"
              exit 1

            fi

          done

          echo ""
          echo "Version:"
          cat VERSION

          echo ""
          echo "✅ Repository validation passed"


      # ==================================================
      # STEP 5
      # Prepare Runtime Directories
      # ==================================================
      - name: 📁 Prepare runtime directories
        run: |
          mkdir -p data
          mkdir -p logs
          mkdir -p runtime_state
          mkdir -p runtime_state_out


      # ==================================================
      # STEP 6
      # Find latest Runtime State Artifact
      #
      # Phase 3 / 6 / 7 的 Persistent Memory
      # 不可以每次 GitHub Runner 重置。
      # ==================================================
      - name: 🔍 Find previous runtime state
        id: find_state
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          echo "Searching previous runtime state..."

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=maritime-runtime-state&per_page=100"
          )

          RUN_ID=$(echo "$RESPONSE" | jq -r '
            [
              .artifacts[]
              | select(.expired == false)
            ]
            | sort_by(.created_at)
            | reverse
            | .[0].workflow_run.id // empty
          ')

          if [ -z "$RUN_ID" ]; then

            echo "ℹ️ No previous runtime state found."
            echo "ℹ️ This will be treated as FIRST GITHUB RUN."

            echo "run_id=" >> "$GITHUB_OUTPUT"
            echo "first_run=true" >> "$GITHUB_OUTPUT"

          else

            echo "✅ Previous runtime state found."
            echo "Previous workflow run: $RUN_ID"

            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "first_run=false" >> "$GITHUB_OUTPUT"

          fi


      # ==================================================
      # STEP 7
      # Download Previous State
      # ==================================================
      - name: 📥 Restore previous runtime state artifact
        if: steps.find_state.outputs.run_id != ''

        uses: actions/download-artifact@v8

        with:
          name: maritime-runtime-state
          path: runtime_state

          github-token: ${{ github.token }}

          run-id: ${{ steps.find_state.outputs.run_id }}


      # ==================================================
      # STEP 8
      # Validate + Restore SQLite
      #
      # 不直接 copy 未驗證 DB。
      # ==================================================
      - name: 🗄️ Validate and restore SQLite state
        id: restore_state

        run: |
          python <<'PY'
          import shutil
          import sqlite3
          import sys

          from pathlib import Path


          state_dir = Path("runtime_state")
          data_dir = Path("data")

          data_dir.mkdir(parents=True, exist_ok=True)


          db_files = list(state_dir.glob("*.db"))


          if not db_files:
              print("ℹ️ No previous SQLite state to restore.")
              print("FIRST RUN MODE")

              Path("/tmp/state_status").write_text(
                  "FIRST_RUN",
                  encoding="utf-8",
              )

              sys.exit(0)


          restored = 0


          for source in db_files:

              print(f"Checking: {source.name}")

              try:
                  conn = sqlite3.connect(
                      f"file:{source}?mode=ro",
                      uri=True,
                  )

                  result = conn.execute(
                      "PRAGMA integrity_check"
                  ).fetchone()[0]

                  conn.close()

              except Exception as exc:
                  print(
                      f"❌ Unable to validate "
                      f"{source.name}: {exc}"
                  )

                  sys.exit(1)


              if result.lower() != "ok":

                  print(
                      f"❌ SQLite integrity check failed: "
                      f"{source.name}"
                  )

                  sys.exit(1)


              destination = data_dir / source.name

              shutil.copy2(
                  source,
                  destination,
              )

              print(
                  f"✅ Restored {source.name}"
              )

              restored += 1


          print(
              f"✅ Runtime state restored: "
              f"{restored} database(s)"
          )

          Path("/tmp/state_status").write_text(
              "RESTORED",
              encoding="utf-8",
          )
          PY

          STATE_STATUS=$(cat /tmp/state_status)

          echo "status=$STATE_STATUS" >> "$GITHUB_OUTPUT"

          echo "Runtime State: $STATE_STATUS"


      # ==================================================
      # STEP 9
      # Decide Runtime Mode
      #
      # First GitHub Run：
      #   Email DRY_RUN = true
      #   Teams = false
      #
      # 目的：
      # 建立 baseline / SQLite state，
      # 避免第一次搬上 GitHub 時大量 NEW EVENT 通知。
      # ==================================================
      - name: ⚙️ Determine runtime mode
        id: runtime_mode

        run: |
          FIRST_RUN="${{ steps.find_state.outputs.first_run }}"
          MANUAL_DRY="${{ inputs.dry_run }}"

          if [ "$FIRST_RUN" = "true" ]; then

            echo "ℹ️ First GitHub run detected."
            echo "Baseline safety mode enabled."

            EFFECTIVE_DRY_RUN="true"
            EFFECTIVE_TEAMS="false"

          elif [ "$MANUAL_DRY" = "true" ]; then

            echo "ℹ️ Manual Dry Run enabled."

            EFFECTIVE_DRY_RUN="true"
            EFFECTIVE_TEAMS="false"

          else

            EFFECTIVE_DRY_RUN="false"
            EFFECTIVE_TEAMS="${{ vars.TEAMS_ENABLED || 'false' }}"

          fi

          echo "effective_dry_run=$EFFECTIVE_DRY_RUN" \
            >> "$GITHUB_OUTPUT"

          echo "effective_teams=$EFFECTIVE_TEAMS" \
            >> "$GITHUB_OUTPUT"

          echo ""
          echo "Dry Run : $EFFECTIVE_DRY_RUN"
          echo "Teams   : $EFFECTIVE_TEAMS"


      # ==================================================
      # STEP 10
      # System Health Check
      #
      # Phase 8 已建立
      # scripts/health_check.py
      # ==================================================
      - name: 🩺 Pre-flight health check
        env:
          DRY_RUN: ${{ steps.runtime_mode.outputs.effective_dry_run }}
          TEAMS_ENABLED: ${{ steps.runtime_mode.outputs.effective_teams }}

        run: |
          python scripts/health_check.py


      # ==================================================
      # STEP 11
      # MAIN PRODUCTION PIPELINE
      #
      # 唯一 Production Entry Point：
      #
      # maritime_news.py
      #
      # 不再執行：
      # news_scraper.py
      # ==================================================
      - name: 🚀 Run Maritime Intelligence
        id: intelligence

        env:
          DRY_RUN: ${{ steps.runtime_mode.outputs.effective_dry_run }}

          TEAMS_ENABLED: ${{ steps.runtime_mode.outputs.effective_teams }}

        run: |
          echo "============================================"
          echo " WHL MARITIME INTELLIGENCE"
          echo " Production Cycle"
          echo "============================================"
          echo ""

          echo "Run ID:"
          echo "${GITHUB_RUN_ID}"

          echo ""
          echo "Hours Back:"
          echo "${NEWS_HOURS_BACK}"

          echo ""
          echo "Dry Run:"
          echo "${DRY_RUN}"

          echo ""

          python maritime_news.py


      # ==================================================
      # STEP 12
      # Create Safe SQLite Snapshot
      #
      # 無論 Email / Teams 成功與否，
      # 都嘗試保存已更新的 Event Memory。
      #
      # SQLite Backup API 避免直接複製 DB/WAL。
      # ==================================================
      - name: 💾 Create validated runtime state snapshot
        id: snapshot_state

        if: always()

        run: |
          python <<'PY'
          import sqlite3
          import sys

          from pathlib import Path


          data_dir = Path("data")
          output_dir = Path("runtime_state_out")

          output_dir.mkdir(
              parents=True,
              exist_ok=True,
          )


          db_files = list(
              data_dir.glob("*.db")
          )


          if not db_files:

              print(
                  "❌ No runtime SQLite databases "
                  "found in data/"
              )

              sys.exit(1)


          saved = 0


          for source in db_files:

              print(
                  f"Snapshotting: {source.name}"
              )

              destination = (
                  output_dir / source.name
              )


              try:
                  source_db = sqlite3.connect(
                      str(source)
                  )

                  check = source_db.execute(
                      "PRAGMA integrity_check"
                  ).fetchone()[0]


                  if check.lower() != "ok":

                      print(
                          f"❌ Source DB integrity "
                          f"failed: {source.name}"
                      )

                      source_db.close()

                      sys.exit(1)


                  destination_db = (
                      sqlite3.connect(
                          str(destination)
                      )
                  )


                  source_db.backup(
                      destination_db
                  )


                  destination_check = (
                      destination_db.execute(
                          "PRAGMA integrity_check"
                      ).fetchone()[0]
                  )


                  destination_db.close()
                  source_db.close()


                  if (
                      destination_check.lower()
                      != "ok"
                  ):

                      print(
                          f"❌ Snapshot integrity "
                          f"failed: {source.name}"
                      )

                      sys.exit(1)


              except Exception as exc:

                  print(
                      f"❌ Snapshot failed "
                      f"{source.name}: {exc}"
                  )

                  sys.exit(1)


              print(
                  f"✅ Snapshot ready: "
                  f"{destination.name}"
              )

              saved += 1


          print(
              f"✅ Runtime state snapshot: "
              f"{saved} database(s)"
          )
          PY


      # ==================================================
      # STEP 13
      # Persist Runtime State Between GitHub Runs
      # ==================================================
      - name: ☁️ Save runtime state
        if: always() && steps.snapshot_state.outcome == 'success'

        uses: actions/upload-artifact@v7

        with:
          name: maritime-runtime-state

          path: runtime_state_out/*.db

          retention-days: 30

          if-no-files-found: error


      # ==================================================
      # STEP 14
      # Upload Failure Logs Only
      #
      # 正常成功時不額外保存 log artifact。
      # ==================================================
      - name: 📄 Upload diagnostic logs
        if: failure()

        uses: actions/upload-artifact@v7

        with:
          name: maritime-intelligence-error-${{ github.run_id }}

          path: |
            logs/*.log

          retention-days: 7

          if-no-files-found: ignore


      # ==================================================
      # STEP 15
      # GitHub Actions Job Summary
      # ==================================================
      - name: 📊 Write GitHub job summary
        if: always()

        run: |
          STATE_STATUS="${{ steps.restore_state.outputs.status }}"

          if [ -z "$STATE_STATUS" ]; then
            STATE_STATUS="UNKNOWN"
          fi

          {
            echo "# 🚢 WHL Maritime Intelligence"
            echo ""
            echo "**Version:** $(cat VERSION)"
            echo ""
            echo "| Item | Status |"
            echo "|---|---|"
            echo "| Workflow Run | \`${GITHUB_RUN_ID}\` |"
            echo "| Trigger | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Runtime State | **${STATE_STATUS}** |"
            echo "| Dry Run | \`${{ steps.runtime_mode.outputs.effective_dry_run }}\` |"
            echo "| Teams | \`${{ steps.runtime_mode.outputs.effective_teams }}\` |"
            echo "| Intelligence Pipeline | **${{ steps.intelligence.outcome }}** |"
            echo "| State Snapshot | **${{ steps.snapshot_state.outcome }}** |"
            echo ""
            echo "### Runtime"
            echo ""
            echo "- Hours Back: \`${NEWS_HOURS_BACK}\`"
            echo "- Timezone: \`Asia/Taipei\`"
            echo "- Python: \`$(python --version)\`"
            echo ""
            echo "### Persistent Memory"
            echo ""
            echo "Runtime state is restored before execution and saved after execution."
            echo ""
            echo "> GitHub Actions runs the scheduled intelligence cycle only."
            echo "> FastAPI Dashboard is not hosted by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"


      # ==================================================
      # STEP 16
      # Failure Diagnostics
      # ==================================================
      - name: ❌ Failure diagnostics
        if: failure()

        run: |
          echo ""
          echo "============================================"
          echo " WHL Maritime Intelligence"
          echo " EXECUTION FAILED"
          echo "============================================"
          echo ""
          echo "請依序檢查："
          echo ""
          echo "1. GitHub Secrets"
          echo "   MAIL_USER"
          echo "   MAIL_PASSWORD"
          echo "   TARGET_EMAIL"
          echo ""
          echo "2. Runtime State"
          echo "   SQLite artifact restore / integrity"
          echo ""
          echo "3. Configuration"
          echo "   config/*.json"
          echo "   .env.example"
          echo ""
          echo "4. System Health"
          echo "   python scripts/health_check.py"
          echo ""
          echo "5. Logs"
          echo "   本次 failure log 已嘗試上傳為 Artifact"
          echo ""
          echo "6. Optional Features"
          echo "   Teams / LLM failure 不應破壞核心流程"
          echo ""
          echo "============================================"
